<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="0.55" stop-color="#8b4dff"/>
      <stop offset="1" stop-color="#e0559f"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <radialGradient id="doorGlow" cx="0.5" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1a0b4a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#shine)"/>
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="27.25" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Warm light spilling from the door -->
  <ellipse cx="64" cy="96" rx="30" ry="14" fill="url(#doorGlow)"/>

  <!-- House -->
  <g filter="url(#shadow)">
    <polyline points="31,63 64,35 97,63" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M41 60 L64 41 L87 60 V88 a6 6 0 0 1 -6 6 H47 a6 6 0 0 1 -6 -6 Z" fill="#fff"/>
  </g>
  <rect x="56" y="70" width="16" height="24" rx="8" fill="url(#door)"/>
  <rect x="56" y="86" width="16" height="8" fill="url(#door)"/>
</svg>
